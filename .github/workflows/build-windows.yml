name: Build Windows Application

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest # 使用最新的 Windows 运行环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Node.js 环境，用于构建 Vue 应用
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # 使用 Node.js 16

      # 构建 Vue 应用
      - name: Build Vue application
        run: |
          cd app-webview
          npm install
          npm run build
    
      # 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1' # 指定 Flutter 版本
          cache: true # 缓存 Flutter 环境

      # 新增：动态设置版本号
      - name: Set version
        id: set_version
        run: |
          $manualTrigger = "${{ github.event_name }}" -eq "workflow_dispatch"
          if ($manualTrigger) {
              $version = "tmp-test$(Get-Date -Format 'yyyyMMddHHmm')"
          } else {
              $version = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Output "VERSION=$version" >> $env:GITHUB_ENV
          
          # 修改 pubspec.yaml 的 version 行
          $pubspecPath = "pubspec.yaml"
          $pubspec = Get-Content -Path $pubspecPath -Raw
          $pubspec = [regex]::Replace($pubspec, '^version: \d+\.\d+\.\d+[\+\d+]?$', "version: $version", [System.Text.RegularExpressions.RegexOptions]::Multiline)
          Set-Content -Path $pubspecPath -Value $pubspec

      # 安装依赖
      - name: Install dependencies
        run: flutter pub get

      # 构建 Windows 应用
      - name: Build Windows application
        run: flutter build windows --release

      # 新增：拷贝必要文件到 Release 目录
      - name: Copy settings and python scripts to Release directory
        run: |
          Copy-Item settings-exa.json build/windows/x64/runner/Release/settings.json
          Copy-Item requirements.txt build/windows/x64/runner/Release/
          New-Item -Path build/windows/x64/runner/Release/lib -ItemType Directory -Force
          Copy-Item lib/web-server.py build/windows/x64/runner/Release/lib/
          Copy-Item lib/libfix_for_flutter.py build/windows/x64/runner/Release/lib/
          Copy-Item lib/change_for_flutter.py build/windows/x64/runner/Release/lib/
          
          # 创建 app-webview 目录结构
          New-Item -Path build/windows/x64/runner/Release/data/app-webview/dist -ItemType Directory -Force
          
          # 拷贝 Vue 应用构建产物到 Release 目录
          Copy-Item -Recurse app-webview/dist/* build/windows/x64/runner/Release/data/app-webview/dist/

      # 上传构建产物
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mstupload-windows-x64-${{ env.VERSION }}
          path: build/windows/x64/runner/Release # Windows 构建产物路径